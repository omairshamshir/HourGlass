[workspace]
resolver = "3"
members = ["crates/hourglass-core", "crates/hourglass-store", "crates/hourglass"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/omairshamshir/hourglass"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast startup matters even in dev: the menu bar must appear instantly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
